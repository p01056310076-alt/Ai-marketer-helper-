<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다중 AI 마케팅 & 콘텐츠 생성 미니앱</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen p-4 sm:p-6">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-5 text-white">
      <h1 class="text-xl font-bold">✨ 올인원 AI 마케팅 헬퍼</h1>
      <p class="text-xs text-indigo-100 mt-1">Gemini · ChatGPT · Claude 지원 미니앱</p>
    </div>

    <!-- AI Engine & API Key Selection -->
    <div class="p-4 bg-indigo-50/50 border-b border-indigo-100 space-y-3">
      <div>
        <label class="block text-xs font-bold text-indigo-900 mb-1">AI 모델 선택</label>
        <select id="aiModel" onchange="updateApiKeyPlaceholder()" class="w-full text-xs p-2.5 bg-white border border-indigo-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
          <option value="gemini">Google Gemini (무료 추천)</option>
          <option value="openai">OpenAI (ChatGPT gpt-4o-mini)</option>
          <option value="claude">Anthropic (Claude 3.5 Sonnet)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-indigo-900 mb-1">API Key 입력</label>
        <input type="password" id="apiKey" placeholder="Gemini API Key를 입력하세요" 
               class="w-full text-xs p-2.5 bg-white border border-indigo-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
    </div>

    <!-- Tab Navigation -->
    <div class="flex border-b border-gray-200 text-xs font-medium text-center text-gray-500 bg-gray-50">
      <button onclick="switchTab('copy')" id="tab-copy" class="flex-1 py-3 border-b-2 border-indigo-600 text-indigo-600 font-bold bg-white">문구 생성</button>
      <button onclick="switchTab('health')" id="tab-health" class="flex-1 py-3 border-b-2 border-transparent hover:text-indigo-600">영양제 추천</button>
      <button onclick="switchTab('script')" id="tab-script" class="flex-1 py-3 border-b-2 border-transparent hover:text-indigo-600">숏폼 대본</button>
    </div>

    <!-- Form Content -->
    <div class="p-5 space-y-4">
      
      <!-- Tab 1: AI 문구 생성 -->
      <div id="section-copy" class="tab-content space-y-3">
        <div>
          <label class="block text-xs font-semibold mb-1">제품 / 서비스명</label>
          <input type="text" id="copyProduct" placeholder="예: 무선 차량용 청소기" class="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">핵심 특징 및 타겟</label>
          <textarea id="copyFeatures" placeholder="예: 강력한 흡입력, 500g 가벼움, 초보 운전자 추천" class="w-full text-sm p-2.5 border rounded-lg h-20 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>
      </div>

      <!-- Tab 2: AI 영양제 추천 -->
      <div id="section-health" class="tab-content hidden space-y-3">
        <div>
          <label class="block text-xs font-semibold mb-1">대상 및 건강 고민</label>
          <input type="text" id="healthTarget" placeholder="예: 40대 직장인, 침침한 눈과 만성 피로" class="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>

      <!-- Tab 3: AI 숏폼 대본 -->
      <div id="section-script" class="tab-content hidden space-y-3">
        <div>
          <label class="block text-xs font-semibold mb-1">숏폼 주제 / 목적</label>
          <input type="text" id="scriptTopic" placeholder="예: 노후 준비 필수 체크리스트 TOP 3" class="w-full text-sm p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>

      <!-- Action Button -->
      <button onclick="generateAI()" id="btnGenerate" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-95 text-white font-bold rounded-xl shadow-md transition duration-200">
        AI 결과 생성하기
      </button>

      <!-- Loading Spinner -->
      <div id="loading" class="hidden text-center py-4">
        <div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-indigo-600"></div>
        <p class="text-xs text-gray-500 mt-2">선택한 AI가 답변을 작성 중입니다...</p>
      </div>

      <!-- Output Area -->
      <div id="outputArea" class="hidden space-y-3 pt-2">
        <label class="block text-xs font-semibold text-gray-700">생성 결과</label>
        <div id="resultText" class="p-3 bg-gray-50 rounded-lg text-xs leading-relaxed text-gray-800 whitespace-pre-wrap border border-gray-200"></div>
        <button onclick="copyResult()" class="w-full py-2 bg-gray-800 hover:bg-gray-900 text-white text-xs font-semibold rounded-lg">
          결과 복사하기
        </button>
      </div>

      <!-- Affiliate / CTA Link -->
      <div class="mt-6 pt-4 border-t border-gray-100 text-center">
        <a href="https://example.com" target="_blank" class="text-xs text-indigo-600 hover:underline font-semibold">
          👉 추천 관련 인기 상품 보러가기 (제휴 마케팅 연결 버튼)
        </a>
      </div>

    </div>
  </div>

  <script>
    let currentTab = 'copy';

    function updateApiKeyPlaceholder() {
      const model = document.getElementById('aiModel').value;
      const keyInput = document.getElementById('apiKey');
      if (model === 'gemini') {
        keyInput.placeholder = 'Gemini API Key를 입력하세요';
      } else if (model === 'openai') {
        keyInput.placeholder = 'OpenAI API Key (sk-...)를 입력하세요';
      } else if (model === 'claude') {
        keyInput.placeholder = 'Anthropic API Key (sk-ant-...)를 입력하세요';
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`section-${tab}`).classList.remove('hidden');
      
      document.querySelectorAll('[id^="tab-"]').forEach(el => {
        el.className = 'flex-1 py-3 border-b-2 border-transparent hover:text-indigo-600';
      });
      document.getElementById(`tab-${tab}`).className = 'flex-1 py-3 border-b-2 border-indigo-600 text-indigo-600 font-bold bg-white';
    }

    async function generateAI() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const aiModel = document.getElementById('aiModel').value;

      if (!apiKey) {
        alert('선택한 AI의 API Key를 입력해주세요.');
        return;
      }

      let prompt = '';
      if (currentTab === 'copy') {
        const prod = document.getElementById('copyProduct').value;
        const feat = document.getElementById('copyFeatures').value;
        prompt = `제품명: ${prod}\n특징: ${feat}\n위 제품을 홍보하기 위한 (1) 블로그 제목 3개, (2) 인스타그램 매력적인 캡션 문구, (3) 대표 카피 문구를 한국어로 작성해줘.`;
      } else if (currentTab === 'health') {
        const target = document.getElementById('healthTarget').value;
        prompt = `고민/대상: ${target}\n이 사용자에게 필요한 영양제 성분 3가지를 추천하고 이유를 친근하게 설명해줘.`;
      } else if (currentTab === 'script') {
        const topic = document.getElementById('scriptTopic').value;
        prompt = `주제: ${topic}\n약 30초 분량의 숏폼(쇼츠/틱톡) 대본을 [후킹 문구] -> [본론 2가지] -> [CTA/마무리] 구조로 작성해줘.`;
      }

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('outputArea').classList.add('hidden');

      try {
        let resultText = '';

        if (aiModel === 'gemini') {
          // Google Gemini API Call
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          const data = await res.json();
          resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Gemini 결과를 가져오지 못했습니다.";

        } else if (aiModel === 'openai') {
          // OpenAI ChatGPT API Call
          const res = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: 'gpt-4o-mini',
              messages: [{ role: 'user', content: prompt }]
            })
          });
          const data = await res.json();
          resultText = data.choices?.[0]?.message?.content || "OpenAI 결과를 가져오지 못했습니다.";

        } else if (aiModel === 'claude') {
          // Anthropic Claude API Call
          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'dangerously-allow-browser': 'true'
            },
            body: JSON.stringify({
              model: 'claude-3-5-sonnet-20241022',
              max_tokens: 1000,
              messages: [{ role: 'user', content: prompt }]
            })
          });
          const data = await res.json();
          resultText = data.content?.[0]?.text || "Claude 결과를 가져오지 못했습니다.";
        }

        document.getElementById('resultText').innerText = resultText;
        document.getElementById('outputArea').classList.remove('hidden');
      } catch (err) {
        alert('AI 생성 실패: API Key가 올바른지 확인해주세요.');
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function copyResult() {
      const text = document.getElementById('resultText').innerText;
      navigator.clipboard.writeText(text).then(() => alert('클립보드에 복사되었습니다!'));
    }
  </script>
</body>
</html>
