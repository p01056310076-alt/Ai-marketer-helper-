<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 마케터 헬퍼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 폭 34rem 작업 카드. 상단 탭 3개, 아래 입력 → 결과 */
:root {
  --bg: #eef0f4;
  --card: #ffffff;
  --fg: #1d2330;
  --muted: #5d6576;
  --line: #d6dae3;
  --accent: #23508a;
  --accent-ink: #ffffff;
  --accent-soft: #e3eaf5;
  --green: #2f6b4f;
  --green-soft: #e2ede5;
  --danger: #a33b2b;
  --display: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --card: #1b2029; --fg: #e5e8ef; --muted: #9aa2b3; --line: #2f3644;
    --accent: #84aee8; --accent-ink: #0f1a2b; --accent-soft: #1f2c40;
    --green: #7cc39d; --green-soft: #1f3128; --danger: #ef8a78; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --card: #1b2029; --fg: #e5e8ef; --muted: #9aa2b3; --line: #2f3644;
  --accent: #84aee8; --accent-ink: #0f1a2b; --accent-soft: #1f2c40;
  --green: #7cc39d; --green-soft: #1f3128; --danger: #ef8a78; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6; padding: 24px 16px 40px; }
.wrap { max-width: 34rem; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header h1 { font-family: var(--display); font-weight: 400; font-size: 2rem; line-height: 1.2; margin: 0; letter-spacing: .01em; }
header p { margin: 4px 0 0; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }

.keybox { gap: 8px; }
.keybox .row { display: flex; gap: 8px; }
.keybox .row input { flex: 1; min-width: 0; }
.status { font-size: 12.5px; color: var(--muted); margin: 0; }
.status.ok { color: var(--green); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-weight: 500; align-self: flex-start; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--muted); padding: 10px 4px; border-radius: 9px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tabs button small { font-size: 11px; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

label.lbl, legend { font-weight: 600; font-size: 14px; display: block; margin-bottom: 6px; padding: 0; }
.hint { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: 4px; }
input[type="text"], input[type="password"], textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 84px; resize: vertical; }
input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.seg input, .chips input { position: absolute; opacity: 0; pointer-events: none; }
.seg label, .chips label { cursor: pointer; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.seg label:has(input:checked), .chips label:has(input:checked) { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 600; }
.seg label:has(input:focus-visible), .chips label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips label.off { opacity: .45; cursor: not-allowed; }

.btn { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 13px; cursor: pointer; width: 100%; }
.btn-primary { background: var(--accent); color: var(--accent-ink); font-size: 15.5px; }
.btn-primary:disabled { opacity: .55; cursor: wait; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 9px 12px; font-size: 13.5px; width: auto; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.msg { font-size: 13px; color: var(--danger); margin: 0; }

.out h2 { margin: 0; font-size: 15px; }
.out-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.result { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.75; min-width: 0; }
.result strong { color: var(--accent); }
.thinking { color: var(--muted); }
.nutrients { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.nutrients li { border-top: 1px solid var(--line); padding-top: 10px; }
.nutrients b { display: block; }
.nutrients .for { font-size: 12.5px; color: var(--green); }
.nutrients p { margin: 2px 0 0; font-size: 14px; }
.nutrients .tip { color: var(--muted); }
.fine { font-size: 12px; color: var(--muted); margin: 0; }
.cta { display: block; text-align: center; padding: 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 600; text-decoration: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI 마케터 헬퍼</h1>
    <p>홍보 문구 · 영양 성분 추천 · 숏폼 대본</p>
  </header>

  <section class="card keybox" id="keyBox" hidden>
    <label class="lbl" for="apiKey">Gemini API 키<span class="hint">문구·대본 탭에서만 사용</span></label>
    <div class="row">
      <input type="password" id="apiKey" placeholder="AIza… 로 시작하는 키" autocomplete="off">
      <button type="button" class="btn btn-ghost" id="saveKey">저장</button>
      <button type="button" class="btn btn-ghost" id="clearKey">지우기</button>
    </div>
    <p class="status" id="keyStatus">aistudio.google.com 에서 무료로 발급받을 수 있어요. 이 기기 브라우저에만 저장돼요.</p>
  </section>
  <span class="badge" id="claudeBadge" hidden>문구·대본 탭도 API 키 없이 사용 중</span>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-copy" aria-selected="true">문구 생성<small>AI</small></button>
    <button type="button" role="tab" id="tab-health" aria-selected="false">영양 추천<small>키 불필요</small></button>
    <button type="button" role="tab" id="tab-script" aria-selected="false">숏폼 대본<small>AI</small></button>
  </div>

  <!-- 문구 생성 -->
  <form class="card" id="panel-copy" novalidate>
    <div>
      <label class="lbl" for="copyProduct">제품 / 서비스명</label>
      <input type="text" id="copyProduct" value="수제 자몽청">
    </div>
    <div>
      <label class="lbl" for="copyFeatures">핵심 특징과 타겟</label>
      <textarea id="copyFeatures">국내산 설탕과 생과일로 매일 소량 제조, 탄산수에 타면 에이드 완성, 30~50대 홈카페 손님</textarea>
    </div>
    <p class="msg" hidden></p>
    <button type="submit" class="btn btn-primary">홍보 문구 만들기</button>
  </form>

  <!-- 영양 추천 (키 없이 동작) -->
  <form class="card" id="panel-health" novalidate hidden>
    <fieldset>
      <legend>성별</legend>
      <div class="seg">
        <label><input type="radio" name="gender" id="g-f" value="여성" checked><span>여성</span></label>
        <label><input type="radio" name="gender" id="g-m" value="남성"><span>남성</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>연령대</legend>
      <div class="seg">
        <label><input type="radio" name="age" id="a-20" value="20"><span>20대</span></label>
        <label><input type="radio" name="age" id="a-30" value="30"><span>30대</span></label>
        <label><input type="radio" name="age" id="a-40" value="40" checked><span>40대</span></label>
        <label><input type="radio" name="age" id="a-50" value="50"><span>50대</span></label>
        <label><input type="radio" name="age" id="a-60" value="60"><span>60대 이상</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>건강 고민<span class="hint">최대 3개</span></legend>
      <div class="chips">
        <label><input type="checkbox" name="concern" id="c-fatigue" value="fatigue" checked><span>만성 피로</span></label>
        <label><input type="checkbox" name="concern" id="c-eye" value="eye" checked><span>눈 건강</span></label>
        <label><input type="checkbox" name="concern" id="c-blood" value="blood"><span>혈행 개선</span></label>
        <label><input type="checkbox" name="concern" id="c-gut" value="gut"><span>장 건강·소화</span></label>
        <label><input type="checkbox" name="concern" id="c-bone" value="bone"><span>관절·뼈 건강</span></label>
        <label><input type="checkbox" name="concern" id="c-immune" value="immune"><span>면역·피부</span></label>
      </div>
    </fieldset>
    <p class="msg" hidden></p>
    <button type="submit" class="btn btn-primary">추천 성분 보기</button>
  </form>

  <!-- 숏폼 대본 -->
  <form class="card" id="panel-script" novalidate hidden>
    <div>
      <label class="lbl" for="scriptTopic">숏폼 주제 / 목적</label>
      <input type="text" id="scriptTopic" value="노후 대비 국민연금 연령별 수령 꿀팁">
    </div>
    <p class="msg" hidden></p>
    <button type="submit" class="btn btn-primary">30초 대본 만들기</button>
  </form>

  <section class="card out" id="outputArea" hidden aria-live="polite">
    <div class="out-head">
      <h2 id="outTitle">생성 결과</h2>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn btn-ghost" id="btnStop" hidden>멈추기</button>
        <button type="button" class="btn btn-ghost" id="btnCopy">복사</button>
      </div>
    </div>
    <div class="result" id="resultText"></div>
    <ol class="nutrients" id="nutrients" hidden></ol>
    <p class="fine" id="healthFine" hidden>일반적인 건강 정보로 참고용이며, 질병의 진단·치료를 대신하지 않습니다. 복용 중인 약이 있다면 의사·약사와 먼저 상담하세요.</p>
    <a class="cta" id="ctaLink" href="https://example.com" target="_blank" rel="noopener">추천 관련 인기 상품 보러가기</a>
  </section>
</div>

<script>
// ▼ 셀러 설정: 제휴·판매 링크
const SELLER_LINK = "https://example.com";
const KEY_STORE = "marketer_gemini_key";
const $ = (id) => document.getElementById(id);
$("ctaLink").href = SELLER_LINK;

/* ---------- 연결 방식: Claude 안이면 키 없이, 아니면 Gemini 키 ---------- */
let mode = "pending", sample = null, ctl = null;
function loadKey() { try { return localStorage.getItem(KEY_STORE) || ""; } catch { return ""; } }
function keyStatus() {
  const has = !!loadKey();
  $("keyStatus").textContent = has ? "저장된 키로 사용 중이에요. 이 기기 브라우저에만 저장돼요." : "aistudio.google.com 에서 무료로 발급받을 수 있어요. 이 기기 브라우저에만 저장돼요.";
  $("keyStatus").classList.toggle("ok", has);
}
(async () => {
  try { sample = window.claude?.use ? await window.claude.use("sample") : null; } catch { sample = null; }
  mode = sample ? "claude" : "gemini";
  if (mode === "claude") $("claudeBadge").hidden = false;
  else { $("keyBox").hidden = false; $("apiKey").value = loadKey(); keyStatus(); }
})();
$("saveKey").onclick = () => { try { localStorage.setItem(KEY_STORE, $("apiKey").value.trim()); } catch {} keyStatus(); };
$("clearKey").onclick = () => { $("apiKey").value = ""; try { localStorage.removeItem(KEY_STORE); } catch {} keyStatus(); };

/* ---------- 탭 ---------- */
const tabs = ["copy", "health", "script"];
let current = "copy";
tabs.forEach(t => $("tab-" + t).onclick = () => {
  current = t;
  tabs.forEach(x => { $("tab-" + x).setAttribute("aria-selected", x === t); $("panel-" + x).hidden = x !== t; });
  $("outputArea").hidden = true;
});

/* ---------- 결과 표시 ---------- */
function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function renderText(t) { $("resultText").innerHTML = esc(t).replace(/^#{1,4}\s*/gm, "").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
function showOut(title, isHealth) {
  $("outTitle").textContent = title;
  $("nutrients").hidden = !isHealth; $("healthFine").hidden = !isHealth;
  $("outputArea").hidden = false;
}
function formMsg(form, t) { const m = form.querySelector(".msg"); m.textContent = t; m.hidden = !t; }

/* ---------- AI 호출 (문구·대본) ---------- */
const errCopy = {
  not_granted: "Claude 사용을 허용하지 않아 만들 수 없어요.",
  sampling_disabled: "이 계정에서는 AI 생성을 쓸 수 없어요.",
  rate_limited: "요청이 많아요. 잠시 후 다시 눌러주세요.",
  session_expired: "로그인이 만료됐어요. 다시 로그인해주세요.",
  refused: "이 내용으로는 만들 수 없어요. 입력을 바꿔 다시 시도해주세요.",
};
async function generate(form, prompt) {
  formMsg(form, "");
  if (mode === "pending") return formMsg(form, "연결을 확인하는 중이에요. 몇 초 뒤 다시 눌러주세요.");
  const key = $("apiKey").value.trim();
  if (mode === "gemini" && !key) { formMsg(form, "위쪽에 Gemini API 키를 넣고 저장해주세요."); $("apiKey").focus(); return; }

  const btn = form.querySelector("button[type=submit]"), label = btn.textContent;
  btn.disabled = true; btn.textContent = "만드는 중…";
  showOut("생성 결과", false);
  $("resultText").innerHTML = '<span class="thinking">AI가 쓰고 있어요…</span>';
  try {
    if (mode === "claude") {
      ctl = new AbortController(); $("btnStop").hidden = false;
      try {
        const { text } = await sample(prompt, { signal: ctl.signal, onText: ({ text }) => renderText(text) });
        renderText(text);
      } catch (e) {
        if (e.text) renderText(e.text); else $("resultText").textContent = "";
        if (e.code !== "cancelled") formMsg(form, errCopy[e.code] || "연결이 불안정해요. 다시 눌러주세요.");
      } finally { $("btnStop").hidden = true; }
    } else {
      try { localStorage.setItem(KEY_STORE, key); } catch {}
      keyStatus();
      const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data?.error?.message || "fail");
      renderText(data.candidates?.[0]?.content?.parts?.[0]?.text || "결과를 만들지 못했어요. 다시 눌러주세요.");
    }
  } catch {
    $("resultText").textContent = "";
    formMsg(form, "만들지 못했어요. API 키가 맞는지, 인터넷 연결을 확인해주세요.");
  } finally { btn.disabled = false; btn.textContent = label; }
}
$("btnStop").onclick = () => ctl?.abort();

$("panel-copy").addEventListener("submit", (e) => {
  e.preventDefault();
  const prod = $("copyProduct").value.trim(), feat = $("copyFeatures").value.trim();
  if (!prod) return formMsg(e.target, "제품 / 서비스명을 넣어주세요.");
  generate(e.target, `당신은 한국 소상공인 전문 카피라이터입니다.
제품명: ${prod}
특징·타겟: ${feat || "없음"}

아래 3가지를 한국어로 작성해주세요.
1. **블로그 제목 3개** (검색에 잘 걸리도록 핵심 단어 포함)
2. **인스타그램 캡션** (3~5줄, 이모지 적당히, 마지막 줄에 해시태그 5개)
3. **대표 카피 한 줄** (15자 안팎)

지켜야 할 것: 입력에 없는 효능·수치·수상 경력을 지어내지 말고, "최고", "100%", "치료" 같은 과장 표현은 쓰지 마세요.`);
});

$("panel-script").addEventListener("submit", (e) => {
  e.preventDefault();
  const topic = $("scriptTopic").value.trim();
  if (!topic) return formMsg(e.target, "숏폼 주제를 넣어주세요.");
  generate(e.target, `주제: ${topic}

약 30초 분량의 유튜브 쇼츠·틱톡 대본을 한국어로 작성해주세요.
형식:
**[후킹 0~3초]** 화면 자막 + 말할 문장
**[본론 1]** 핵심 포인트 하나
**[본론 2]** 핵심 포인트 하나
**[마무리·CTA]** 저장·팔로우 유도 한 문장

장면마다 (화면 연출) 메모를 괄호로 짧게 달아주세요.
숫자·제도·금액처럼 바뀔 수 있는 정보는 단정하지 말고 "최신 기준 확인 필요"라고 표시해주세요.`);
});

/* ---------- 영양 추천: 미리 써둔 정보로 바로 결과 (키 불필요) ---------- */
const N = {
  vitB: { name: "비타민B군", what: "몸이 음식을 에너지로 바꾸는 데 필요해요.", tip: "아침 식사 후에 드시면 좋아요." },
  magnesium: { name: "마그네슘", what: "에너지 이용과 신경·근육 기능 유지에 필요해요.", tip: "묽은 변이 생기면 양을 줄이세요." },
  iron: { name: "철분", what: "몸속 산소를 나르고 혈액을 만드는 데 필요해요.", tip: "커피·차와는 2시간 떨어뜨려 드세요." },
  vitD: { name: "비타민D", what: "칼슘 흡수와 뼈 형성·유지에 필요해요.", tip: "햇볕을 덜 쬐는 분께 특히 필요해요." },
  lutein: { name: "루테인·지아잔틴", what: "나이 들며 줄어드는 황반색소밀도를 유지해 눈 건강에 도움을 줄 수 있어요.", tip: "식사 직후에 드시면 흡수가 잘돼요." },
  omega3: { name: "오메가-3 (EPA·DHA)", what: "혈중 중성지질·혈행 개선, 건조한 눈 개선에 도움을 줄 수 있어요.", tip: "혈액을 묽게 하는 약을 드신다면 먼저 상담하세요." },
  vitA: { name: "비타민A", what: "어두운 곳에서 시각 적응에 필요해요.", tip: "종합비타민과 겹치지 않는지 확인하세요." },
  ginkgo: { name: "은행잎추출물", what: "혈행 개선과 기억력 개선에 도움을 줄 수 있어요.", tip: "혈액을 묽게 하는 약·수술 전후에는 피하세요." },
  vitE: { name: "비타민E", what: "유해산소로부터 세포를 보호하는 데 필요해요.", tip: "식사 직후에 드세요." },
  probiotics: { name: "프로바이오틱스", what: "유익균 증식과 원활한 배변활동에 도움을 줄 수 있어요.", tip: "제품 안내 시간에 맞춰 꾸준히 드세요." },
  fiber: { name: "식이섬유", what: "원활한 배변활동에 도움을 줄 수 있어요.", tip: "물을 충분히 함께 마셔야 해요." },
  calcium: { name: "칼슘", what: "뼈와 치아 형성, 신경과 근육 기능 유지에 필요해요.", tip: "나눠 드시고 철분과는 시간을 띄우세요." },
  msm: { name: "MSM (식이유황)", what: "관절 및 연골 건강에 도움을 줄 수 있어요.", tip: "몇 주 이상 꾸준히 드셔야 해요." },
  vitC: { name: "비타민C", what: "유해산소로부터 세포를 보호하고 결합조직 형성에 필요해요.", tip: "나눠 드시면 흡수가 더 좋아요." },
  zinc: { name: "아연", what: "정상적인 면역기능과 세포 분열에 필요해요.", tip: "식후에 드세요." },
  hyaluronic: { name: "히알루론산", what: "피부 보습에 도움을 줄 수 있어요.", tip: "물을 충분히 마시는 습관과 함께하세요." },
};
const C = {
  fatigue: { label: "만성 피로", list: ["vitB", "magnesium", "iron"] },
  eye: { label: "눈 건강", list: ["lutein", "omega3", "vitA"] },
  blood: { label: "혈행 개선", list: ["omega3", "ginkgo", "vitE"] },
  gut: { label: "장 건강·소화", list: ["probiotics", "fiber", "magnesium"] },
  bone: { label: "관절·뼈 건강", list: ["calcium", "vitD", "msm"] },
  immune: { label: "면역·피부", list: ["vitC", "zinc", "hyaluronic"] },
};
const boxes = [...document.querySelectorAll('input[name="concern"]')];
function syncLimit() {
  const n = boxes.filter(b => b.checked).length;
  boxes.forEach(b => { const off = n >= 3 && !b.checked; b.disabled = off; b.closest("label").classList.toggle("off", off); });
}
boxes.forEach(b => b.addEventListener("change", syncLimit)); syncLimit();

function pickNutrients(concerns, gender, age) {
  const ls = concerns.map(c => {
    let l = [...C[c].list];
    if (c === "fatigue" && !(gender === "여성" && age < 50)) l = l.filter(x => x !== "iron").concat("vitD");
    return l;
  });
  const count = {}; ls.forEach(l => l.forEach(k => (count[k] = (count[k] || 0) + 1)));
  const chosen = [];
  ls.forEach(l => l.forEach(k => { if (count[k] > 1 && !chosen.includes(k)) chosen.push(k); }));
  ls.forEach(l => { if (!l.some(k => chosen.includes(k))) chosen.push(l.find(k => !chosen.includes(k))); });
  for (let i = 0; chosen.length < 3 && i < 3; i++) ls.forEach(l => { const k = l[i]; if (k && chosen.length < 3 && !chosen.includes(k)) chosen.push(k); });
  return chosen.slice(0, 3).map(k => ({ key: k, for: concerns.filter((c, i) => ls[i].includes(k)).map(c => C[c].label) }));
}

$("panel-health").addEventListener("submit", (e) => {
  e.preventDefault();
  const concerns = boxes.filter(b => b.checked).map(b => b.value);
  if (!concerns.length) return formMsg(e.target, "건강 고민을 1개 이상 골라주세요.");
  formMsg(e.target, "");
  const gender = document.querySelector('input[name="gender"]:checked').value;
  const age = Number(document.querySelector('input[name="age"]:checked').value);
  const picks = pickNutrients(concerns, gender, age);
  showOut("추천 영양 성분", true);
  $("resultText").textContent = `${age >= 60 ? "60대 이상" : age + "대"} ${gender}분의 ${concerns.map(c => C[c].label).join(", ")} 고민에 함께 챙기기 좋은 성분이에요.`;
  const ol = $("nutrients"); ol.textContent = "";
  picks.forEach((p, i) => {
    const n = N[p.key], li = document.createElement("li");
    const b = document.createElement("b"); b.textContent = `${i + 1}. ${n.name}`;
    const f = document.createElement("span"); f.className = "for"; f.textContent = p.for.join(" · ");
    const w = document.createElement("p"); w.textContent = n.what;
    const t = document.createElement("p"); t.className = "tip"; t.textContent = "섭취 팁: " + n.tip;
    li.append(b, f, w, t); ol.append(li);
  });
});

/* ---------- 복사 ---------- */
$("btnCopy").onclick = async () => {
  let text = $("resultText").innerText.trim();
  if (!$("nutrients").hidden) text += "\n\n" + [...$("nutrients").children].map(li => li.querySelector("b").textContent + " - " + li.querySelectorAll("p")[0].textContent).join("\n");
  if (!text) return;
  const btn = $("btnCopy");
  try { await navigator.clipboard.writeText(text); btn.textContent = "복사했어요"; }
  catch {
    const r = document.createRange(); r.selectNodeContents($("outputArea"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = "선택됨";
  }
  setTimeout(() => (btn.textContent = "복사"), 2000);
};
</script>
</body>
